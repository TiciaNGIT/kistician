<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#090b0f">
  <title>Soundboard</title>
  <style>
    :root {
      --bg:#090b0f; --panel:#12161c; --panel2:#181e26; --border:#2a323d;
      --text:#f5f7fa; --muted:#8f9aa8; --danger:#ff6868;
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body {
      margin:0; width:100%; min-width:0; min-height:100%; overflow-x:hidden;
      background:radial-gradient(circle at 50% -10%,#202936 0,#10151c 34%,var(--bg) 70%);
      color:var(--text);
      font-family:Inter,"Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,Arial,sans-serif;
    }
    body { min-height:100vh; min-height:100dvh; touch-action:pan-y; }
    button,input { font:inherit; }
    button { border:0; color:inherit; }
    [hidden] { display:none!important; }

    .app {
      width:100%; max-width:820px; min-width:0; margin:0 auto;
      padding:14px 12px calc(26px + var(--safe-bottom));
    }
    .topbar {
      position:sticky; top:0; z-index:20; margin:-14px -12px 14px;
      padding:calc(12px + env(safe-area-inset-top,0px)) 12px 11px;
      background:rgba(9,11,15,.88);
      backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
      border-bottom:1px solid rgba(255,255,255,.06);
    }
    .toprow { display:flex; align-items:center; justify-content:space-between; gap:10px; min-width:0; }
    .title-wrap { min-width:0; }
    h1 { margin:0; font-size:23px; line-height:1.05; letter-spacing:-.04em; }
    .subtitle { margin-top:5px; color:var(--muted); font-size:11px; line-height:1.35; }
    .toolbar { display:flex; gap:7px; flex:0 0 auto; }
    .round-btn {
      width:42px; height:42px; display:grid; place-items:center; border:1px solid var(--border);
      border-radius:13px; background:linear-gradient(180deg,#1b222b,#11161c);
      cursor:pointer; user-select:none;
    }
    .round-btn:active { transform:scale(.95); }
    .round-btn svg {
      width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:2;
      stroke-linecap:round; stroke-linejoin:round;
    }
    .stop-btn { color:#ff8b8b; }

    .search-wrap { position:relative; margin-top:11px; }
    .search {
      width:100%; min-width:0; height:44px; padding:0 13px 0 40px;
      border:1px solid var(--border); border-radius:13px; outline:none;
      background:rgba(20,25,32,.92); color:var(--text); font-size:14px;
    }
    .search:focus { border-color:#657182; }
    .search::placeholder { color:#6f7a87; }
    .search-icon {
      position:absolute; top:50%; left:13px; width:17px; height:17px;
      transform:translateY(-50%); color:#778391; pointer-events:none;
    }
    .search-icon svg {
      width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round;
    }

    .info-row {
      min-width:0; margin:0 2px 12px; display:flex; align-items:center;
      justify-content:space-between; gap:10px; color:var(--muted); font-size:11px;
    }
    .now-playing { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .count { flex:0 0 auto; white-space:nowrap; }

    .board {
      width:100%; min-width:0; display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px;
    }
    .sound {
      position:relative; min-width:0; padding:0; overflow:hidden; border:1px solid var(--border); border-radius:17px;
      background:linear-gradient(145deg,rgba(255,255,255,.035),transparent 38%),var(--panel);
      box-shadow:0 9px 24px rgba(0,0,0,.18); cursor:pointer; text-align:left; user-select:none;
      transition:transform .1s ease,border-color .15s ease,background .15s ease;
    }
    .sound:active { transform:scale(.965); }
    .sound.active {
      border-color:#cbd3dc;
      background:linear-gradient(145deg,rgba(255,255,255,.10),transparent 45%),#1b222b;
      box-shadow:0 0 0 1px rgba(255,255,255,.08),0 10px 28px rgba(0,0,0,.28);
    }

    .sound.active::after {
      content:"";
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      height:6px;
      background:#2684ff;
      box-shadow:0 -2px 10px rgba(38,132,255,.55);
      pointer-events:none;
    }
    .icon-frame { position:relative; width:100%; aspect-ratio:1/1; overflow:hidden; background:#0e1217; }
    .icon-frame img { width:100%; height:100%; display:block; object-fit:cover; pointer-events:none; }
    .play-badge {
      position:absolute; right:7px; bottom:7px; width:30px; height:30px; display:grid; place-items:center;
      border:1px solid rgba(255,255,255,.20); border-radius:50%; background:rgba(5,7,10,.72);
      backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    }
    .play-badge::before {
      content:""; margin-left:2px; width:0; height:0;
      border-top:5px solid transparent; border-bottom:5px solid transparent; border-left:8px solid white;
    }
    .sound.active .play-badge::before {
      width:9px; height:10px; margin:0; border:0;
      background:linear-gradient(90deg,white 0 3px,transparent 3px 6px,white 6px 9px);
    }
    .sound-name {
      min-width:0; padding:9px 9px 10px; overflow:hidden; text-overflow:ellipsis;
      white-space:nowrap; font-size:12px; font-weight:700; text-align:center;
    }

    .state {
      padding:46px 18px; border:1px dashed var(--border); border-radius:18px;
      color:var(--muted); text-align:center; background:rgba(255,255,255,.018);
    }
    .state strong { display:block; margin-bottom:7px; color:var(--text); font-size:15px; }
    .spinner {
      width:28px; height:28px; margin:0 auto 12px; border:3px solid #303946;
      border-top-color:#e5eaf0; border-radius:50%; animation:spin .7s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    .error { color:#ff9898; }

    .toast {
      position:fixed; left:50%; bottom:calc(16px + var(--safe-bottom)); z-index:100;
      width:max-content; max-width:calc(100vw - 28px); padding:10px 13px; transform:translateX(-50%);
      border:1px solid #394452; border-radius:12px; background:rgba(21,26,33,.96);
      box-shadow:0 12px 35px rgba(0,0,0,.4); font-size:12px; text-align:center; pointer-events:none;
    }

    @media (max-width:350px) {
      .board { grid-template-columns:repeat(2,minmax(0,1fr)); }
      h1 { font-size:21px; }
    }
    @media (min-width:520px) {
      .app { padding-inline:18px; }
      .topbar { margin-inline:-18px; padding-inline:18px; }
      .board { grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; }
      .sound-name { font-size:13px; }
    }
    @media (min-width:760px) {
      .board { grid-template-columns:repeat(5,minmax(0,1fr)); }
    }
  </style>
</head>

<body>
  <main class="app">

    <header class="topbar">
      <div class="toprow">
        <div class="title-wrap">
          <h1>Soundboard</h1>
          <div class="subtitle">Koppints egy képre a hang lejátszásához.</div>
        </div>

        <div class="toolbar">
          <button class="round-btn stop-btn" id="stopButton" type="button" title="Leállítás" aria-label="Leállítás">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1"></rect></svg>
          </button>

          <button class="round-btn" id="refreshButton" type="button" title="Frissítés" aria-label="Frissítés">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 6v5h-5"></path><path d="M4 18v-5h5"></path>
              <path d="M6.1 9A7 7 0 0 1 18.2 6.2L20 11"></path>
              <path d="M17.9 15A7 7 0 0 1 5.8 17.8L4 13"></path>
            </svg>
          </button>
        </div>
      </div>

      <div class="search-wrap">
        <div class="search-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
        </div>

        <input class="search" id="searchInput" type="search" autocomplete="off" placeholder="Hang keresése..." aria-label="Hang keresése">
      </div>
    </header>

    <div class="info-row">
      <div class="now-playing" id="nowPlaying">Nincs lejátszás</div>
      <div class="count" id="soundCount"></div>
    </div>

    <section class="board" id="board">
      <div class="state" style="grid-column:1/-1;">
        <div class="spinner"></div>
        Hangok betöltése...
      </div>
    </section>
  </main>

  <div class="toast" id="toast" hidden></div>

  <script>
    const CONFIG = {
      owner: "TicianGIT",
      repo: "kistician",
      branch: "main",
      iconFolder: "ikonok",
      soundFolder: "hangok",
      autoRefreshMs: 5 * 60 * 1000
    };

    const board = document.getElementById("board");
    const searchInput = document.getElementById("searchInput");
    const refreshButton = document.getElementById("refreshButton");
    const stopButton = document.getElementById("stopButton");
    const nowPlaying = document.getElementById("nowPlaying");
    const soundCount = document.getElementById("soundCount");
    const toast = document.getElementById("toast");

    let sounds = [];
    let currentAudio = null;
    let currentKey = null;
    let currentButton = null;
    let refreshInProgress = false;

    function normalizeName(name) {
      return String(name).normalize("NFC").toLocaleLowerCase("hu-HU");
    }

    function fileBaseName(filename) {
      return filename.replace(/\.[^.]+$/, "");
    }

    function displayName(filename) {
      const base = fileBaseName(filename).replace(/[_-]+/g, " ").replace(/\s+/g, " ").trim();
      if (!base) return "Hang";
      return base.charAt(0).toLocaleUpperCase("hu-HU") + base.slice(1);
    }

    function getProjectPath() {
      let parts = decodeURIComponent(location.pathname).split("/").filter(Boolean);

      if (
        location.hostname.toLowerCase().endsWith("github.io") &&
        parts.length &&
        parts[0].toLocaleLowerCase("hu-HU") === CONFIG.repo.toLocaleLowerCase("hu-HU")
      ) {
        parts.shift();
      }

      if (parts.length && /\.[a-z0-9]+$/i.test(parts[parts.length - 1])) {
        parts.pop();
      }

      return parts.join("/");
    }

    function encodeGithubPath(path) {
      return path.split("/").filter(Boolean).map(encodeURIComponent).join("/");
    }

    function githubContentsUrl(folder) {
      const projectPath = getProjectPath();
      const fullPath = [projectPath, folder].filter(Boolean).join("/");

      return (
        `https://api.github.com/repos/${encodeURIComponent(CONFIG.owner)}` +
        `/${encodeURIComponent(CONFIG.repo)}/contents/${encodeGithubPath(fullPath)}` +
        `?ref=${encodeURIComponent(CONFIG.branch)}`
      );
    }

    async function loadFolder(folder) {
      const response = await fetch(githubContentsUrl(folder), {
        cache: "no-store",
        headers: { "Accept": "application/vnd.github+json" }
      });

      if (!response.ok) {
        if (response.status === 403) {
          throw new Error("A GitHub API ideiglenes lekérdezési limitje elfogyott. Próbáld meg később.");
        }

        if (response.status === 404) {
          throw new Error(`Nem található a(z) "${folder}" mappa a GitHub repóban.`);
        }

        throw new Error(`GitHub API hiba (${response.status}).`);
      }

      const data = await response.json();

      if (!Array.isArray(data)) {
        throw new Error(`A(z) "${folder}" nem mappaként érhető el.`);
      }

      return data.filter(item => item.type === "file");
    }

    async function refreshSounds(showLoading = true) {
      if (refreshInProgress) return;

      refreshInProgress = true;
      refreshButton.disabled = true;

      if (showLoading) {
        board.innerHTML = `
          <div class="state" style="grid-column:1/-1;">
            <div class="spinner"></div>
            Hangok betöltése...
          </div>
        `;
      }

      try {
        const [iconFiles, soundFiles] = await Promise.all([
          loadFolder(CONFIG.iconFolder),
          loadFolder(CONFIG.soundFolder)
        ]);

        const pngs = iconFiles.filter(file => /\.png$/i.test(file.name));
        const mp3Map = new Map();

        soundFiles
          .filter(file => /\.mp3$/i.test(file.name))
          .forEach(file => {
            const key = normalizeName(fileBaseName(file.name));
            mp3Map.set(key, file);
          });

        sounds = pngs
          .map(iconFile => {
            const key = normalizeName(fileBaseName(iconFile.name));
            const mp3File = mp3Map.get(key);

            if (!mp3File) return null;

            return {
              key,
              name: displayName(iconFile.name),
              iconUrl: iconFile.download_url,
              soundUrl: mp3File.download_url
            };
          })
          .filter(Boolean)
          .sort((a, b) => a.name.localeCompare(b.name, "hu", { sensitivity: "base" }));

        renderSounds();

        const unmatchedCount = pngs.length - sounds.length;

        if (unmatchedCount > 0) {
          showToast(`${unmatchedCount} PNG-hez nem találtam ugyanolyan nevű MP3-at.`);
        }
      }
      catch (error) {
        console.error(error);

        board.innerHTML = `
          <div class="state error" style="grid-column:1/-1;">
            <strong>Nem sikerült betölteni a Soundboardot</strong>
            ${escapeHtml(error.message)}
          </div>
        `;

        soundCount.textContent = "";
      }
      finally {
        refreshInProgress = false;
        refreshButton.disabled = false;
      }
    }

    function renderSounds() {
      const query = normalizeName(searchInput.value.trim());

      const visibleSounds = sounds.filter(sound =>
        !query || normalizeName(sound.name).includes(query)
      );

      soundCount.textContent = `${visibleSounds.length} hang`;

      if (!visibleSounds.length) {
        board.innerHTML = `
          <div class="state" style="grid-column:1/-1;">
            <strong>${sounds.length ? "Nincs találat" : "Még nincs hang"}</strong>
            ${
              sounds.length
                ? "Próbálj másik keresést."
                : "Tegyél az ikonok mappába egy PNG-t, a hangok mappába pedig egy ugyanolyan nevű MP3-at."
            }
          </div>
        `;
        return;
      }

      board.innerHTML = "";

      visibleSounds.forEach(sound => {
        const button = document.createElement("button");

        button.className =
          "sound" +
          (sound.key === currentKey && currentAudio && !currentAudio.paused ? " active" : "");

        button.type = "button";

        button.innerHTML = `
          <div class="icon-frame">
            <img src="${escapeAttribute(sound.iconUrl)}" alt="${escapeAttribute(sound.name)}" loading="lazy">
            <div class="play-badge"></div>
          </div>
          <div class="sound-name">${escapeHtml(sound.name)}</div>
        `;

        button.addEventListener("click", () => playSound(sound, button));
        board.appendChild(button);
      });
    }

    function playSound(sound, button) {
      // Ha ugyanarra az éppen szóló hangra nyomsz még egyszer,
      // álljon le a lejátszás.
      if (
        currentAudio &&
        currentKey === sound.key &&
        !currentAudio.paused
      ) {
        stopCurrent(true);
        return;
      }

      // Másik hang indításakor az előző álljon le.
      stopCurrent(false);

      currentKey = sound.key;
      currentButton = button;
      currentAudio = new Audio(sound.soundUrl);
      currentAudio.preload = "auto";

      button.classList.add("active");
      nowPlaying.textContent = `Lejátszás: ${sound.name}`;

      if (navigator.vibrate) navigator.vibrate(18);

      currentAudio.addEventListener("ended", clearCurrent);
      currentAudio.addEventListener("error", () => {
        showToast(`Nem sikerült lejátszani: ${sound.name}`);
        clearCurrent();
      });

      const playPromise = currentAudio.play();

      if (playPromise && typeof playPromise.catch === "function") {
        playPromise.catch(error => {
          console.error(error);
          showToast(`Nem sikerült lejátszani: ${sound.name}`);
          clearCurrent();
        });
      }
    }

    function stopCurrent(resetText = true) {
      if (currentAudio) {
        currentAudio.pause();
        try { currentAudio.currentTime = 0; } catch (_) {}
      }

      if (currentButton) currentButton.classList.remove("active");

      currentAudio = null;
      currentKey = null;
      currentButton = null;

      if (resetText) nowPlaying.textContent = "Nincs lejátszás";
    }

    function clearCurrent() {
      if (currentButton) currentButton.classList.remove("active");

      currentAudio = null;
      currentKey = null;
      currentButton = null;
      nowPlaying.textContent = "Nincs lejátszás";
    }

    function showToast(message) {
      toast.textContent = message;
      toast.hidden = false;

      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => { toast.hidden = true; }, 3200);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replace(/`/g, "&#096;");
    }

    searchInput.addEventListener("input", renderSounds);
    refreshButton.addEventListener("click", () => refreshSounds(true));
    stopButton.addEventListener("click", () => stopCurrent(true));

    let lastVisibilityRefresh = Date.now();

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && Date.now() - lastVisibilityRefresh > 60000) {
        lastVisibilityRefresh = Date.now();
        refreshSounds(false);
      }
    });

    if (CONFIG.autoRefreshMs > 0) {
      setInterval(() => {
        if (!document.hidden) refreshSounds(false);
      }, CONFIG.autoRefreshMs);
    }

    refreshSounds(true);
  </script>
</body>
</html>
