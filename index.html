<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#222529"
    >

    <title>Kis Ticián</title>

    <!-- FŐOLDAL FAVICON -->
    <link
        rel="icon"
        id="favicon"
        type="image/png"
        href="favicon.png"
    >

    <link
        rel="apple-touch-icon"
        id="appleTouchIcon"
        href="favicon.png"
    >

    <style>

        :root {

            --bg: #222529;
            --bg-soft: #282c30;

            --panel: #2d3136;
            --panel-hover: #363b40;

            --border: #41474d;

            --text: #ffffff;
            --muted: #aeb4ba;

            --green: #8bb52a;
            --green-dark: #6f941e;

        }


        * {
            box-sizing: border-box;

            -webkit-tap-highlight-color:
                transparent;
        }


        [hidden] {
            display: none !important;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            background:
                var(--bg);

            color:
                var(--text);

            font-family:
                Bahnschrift,
                "Segoe UI",
                Arial,
                sans-serif;

        }


        body {

            min-height: 100vh;
            min-height: 100dvh;

        }



        /* ==============================
           LAUNCHER
        ============================== */


        .launcher {

            width: 100%;

            max-width: 760px;

            margin:
                0
                auto;

            padding:
                22px
                15px
                calc(
                    35px +
                    env(safe-area-inset-bottom)
                );

        }



        /* ==============================
           FEJLÉC
        ============================== */


        .header {

            text-align: center;

            padding:
                22px
                5px
                32px;

        }


        .header h1 {

            margin: 0;

            color:
                #ffffff;

            font-size:
                clamp(
                    28px,
                    7vw,
                    36px
                );

            line-height:
                1.1;

            font-weight:
                700;

            letter-spacing:
                .01em;

        }


        .header p {

            margin:
                8px
                0
                0;

            color:
                var(--muted);

            font-size:
                13px;

            font-weight:
                600;

            text-transform:
                uppercase;

            letter-spacing:
                .14em;

        }



        /* ==============================
           ALKALMAZÁSOK
        ============================== */


        .apps-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    3,
                    minmax(0, 1fr)
                );

            gap:
                14px;

        }



        /* ==============================
           KÁRTYA
        ============================== */


        .app-card {

            min-width: 0;

            display: flex;

            flex-direction:
                column;

            align-items:
                center;

            justify-content:
                flex-start;

            gap:
                11px;

            padding:
                14px
                7px
                13px;

            border:
                1px
                solid
                var(--border);

            border-radius:
                20px;

            background:
                var(--panel);

            color:
                var(--text);

            text-decoration:
                none;

            cursor:
                pointer;

            box-shadow:
                0
                8px
                22px
                rgba(
                    0,
                    0,
                    0,
                    .16
                );

            transition:
                transform
                .15s
                ease,
                background
                .15s
                ease,
                border-color
                .15s
                ease;

        }


        .app-card:active {

            transform:
                scale(.95);

            background:
                var(--panel-hover);

            border-color:
                var(--green);

        }



        /* ==============================
           IKON
        ============================== */


        .icon-box {

            width:
                clamp(
                    68px,
                    21vw,
                    88px
                );

            aspect-ratio:
                1 / 1;

            display: flex;

            align-items:
                center;

            justify-content:
                center;

            overflow:
                hidden;

            border-radius:
                20px;

            background:
                #ffffff;

            box-shadow:
                0
                6px
                18px
                rgba(
                    0,
                    0,
                    0,
                    .24
                );

        }


        .icon-box img {

            width:
                100%;

            height:
                100%;

            /*
                FONTOS:
                nem vágja le a logót
            */

            object-fit:
                contain;

            padding:
                7px;

            display:
                block;

        }



        /* ==============================
           HIÁNYZÓ IKON
        ============================== */


        .fallback-icon {

            width:
                100%;

            height:
                100%;

            display: flex;

            align-items:
                center;

            justify-content:
                center;

            background:
                linear-gradient(
                    135deg,
                    var(--green-dark),
                    var(--green)
                );

            color:
                #ffffff;

            font-size:
                30px;

            font-weight:
                700;

        }



        /* ==============================
           ALKALMAZÁSNÉV
        ============================== */


        .app-name {

            width:
                100%;

            min-height:
                34px;

            display: flex;

            align-items:
                flex-start;

            justify-content:
                center;

            text-align:
                center;

            font-size:
                12px;

            line-height:
                1.3;

            font-weight:
                600;

            overflow-wrap:
                anywhere;

            hyphens:
                auto;

        }



        /* ==============================
           BETÖLTÉS
        ============================== */


        .loading,
        .message {

            grid-column:
                1 / -1;

            padding:
                55px
                20px;

            text-align:
                center;

            color:
                var(--muted);

            font-size:
                14px;

        }


        .spinner {

            width:
                32px;

            height:
                32px;

            margin:
                0
                auto
                15px;

            border:
                3px
                solid
                #464c52;

            border-top-color:
                var(--green);

            border-radius:
                50%;

            animation:
                spin
                .75s
                linear
                infinite;

        }


        @keyframes spin {

            to {

                transform:
                    rotate(360deg);

            }

        }



        /* ==============================
           PROJEKT NÉZET
        ============================== */


        .project-view {

            position:
                fixed;

            inset:
                0;

            z-index:
                9999;

            display: flex;

            flex-direction:
                column;

            width:
                100%;

            height:
                100vh;

            height:
                100dvh;

            background:
                var(--bg);

        }



        /* ==============================
           PROJEKT FEJLÉC
        ============================== */


        .project-toolbar {

            flex:
                0
                0
                auto;

            min-height:
                calc(
                    52px +
                    env(safe-area-inset-top)
                );

            padding:
                env(safe-area-inset-top)
                10px
                0;

            display: grid;

            grid-template-columns:
                46px
                1fr
                46px;

            align-items:
                center;

            gap:
                8px;

            background:
                #282c30;

            border-bottom:
                1px
                solid
                #3e444a;

            box-shadow:
                0
                4px
                15px
                rgba(
                    0,
                    0,
                    0,
                    .18
                );

        }



        /* ==============================
           VISSZA GOMB
        ============================== */


        .back-button {

            width:
                42px;

            height:
                42px;

            border:
                0;

            border-radius:
                11px;

            background:
                linear-gradient(
                    135deg,
                    var(--green-dark),
                    var(--green)
                );

            color:
                #ffffff;

            font-family:
                inherit;

            font-size:
                25px;

            line-height:
                1;

            font-weight:
                700;

            cursor:
                pointer;

        }


        .back-button:active {

            transform:
                scale(.94);

        }



        /* ==============================
           PROJEKT CÍM
        ============================== */


        .project-title {

            min-width:
                0;

            overflow:
                hidden;

            text-overflow:
                ellipsis;

            white-space:
                nowrap;

            text-align:
                center;

            color:
                #ffffff;

            font-size:
                13px;

            font-weight:
                600;

        }



        /* ==============================
           MINI IKON
        ============================== */


        .project-mini-icon {

            width:
                38px;

            height:
                38px;

            justify-self:
                end;

            border-radius:
                9px;

            object-fit:
                contain;

            padding:
                3px;

            background:
                #ffffff;

        }



        /* ==============================
           IFRAME
        ============================== */


        .project-frame {

            flex:
                1
                1
                auto;

            width:
                100%;

            min-height:
                0;

            border:
                0;

            background:
                #ffffff;

        }



        /* ==============================
           TABLET / DESKTOP
        ============================== */


        @media (
            min-width: 520px
        ) {

            .apps-grid {

                grid-template-columns:
                    repeat(
                        4,
                        minmax(0, 1fr)
                    );

            }


            .app-name {

                font-size:
                    13px;

            }

        }



        /* ==============================
           KIS TELEFON
        ============================== */


        @media (
            max-width: 350px
        ) {

            .apps-grid {

                grid-template-columns:
                    repeat(
                        2,
                        minmax(0, 1fr)
                    );

            }

        }

    </style>
</head>


<body>


<!-- ==================================
     LAUNCHER
================================== -->

<div
    class="launcher"
    id="launcher"
>

    <header
        class="header"
    >

        <h1>
            Kis Ticián
        </h1>

        <p>
            GITHUB projektek
        </p>

    </header>


    <main
        class="apps-grid"
        id="appsGrid"
    >

        <div
            class="loading"
        >

            <div
                class="spinner"
            ></div>

            Projektek betöltése...

        </div>

    </main>

</div>



<!-- ==================================
     PROJEKT NÉZET
================================== -->

<div
    class="project-view"
    id="projectView"
    hidden
>

    <div
        class="project-toolbar"
    >

        <button
            class="back-button"
            id="backButton"
            type="button"
            aria-label="Vissza"
        >
            ‹
        </button>


        <div
            class="project-title"
            id="projectTitle"
        ></div>


        <img
            class="project-mini-icon"
            id="projectMiniIcon"
            alt=""
        >

    </div>


    <iframe
        class="project-frame"
        id="projectFrame"
        title="Projekt"
    ></iframe>

</div>



<script>

    /* ==================================
       GITHUB
    ================================== */

    const GITHUB_USER =
        "TicianGIT";

    const GITHUB_REPO =
        "kistician";

    const GITHUB_BRANCH =
        "main";



    /* ==================================
       EZEK NEM PROJEKT MAPPÁK
    ================================== */

    const KIZART_MAPPAK = [

        "ikonok",
        ".github",
        ".git"

    ];



    /* ==================================
       ELEMEK
    ================================== */

    const launcher =
        document.getElementById(
            "launcher"
        );


    const appsGrid =
        document.getElementById(
            "appsGrid"
        );


    const projectView =
        document.getElementById(
            "projectView"
        );


    const projectFrame =
        document.getElementById(
            "projectFrame"
        );


    const projectTitle =
        document.getElementById(
            "projectTitle"
        );


    const projectMiniIcon =
        document.getElementById(
            "projectMiniIcon"
        );


    const backButton =
        document.getElementById(
            "backButton"
        );


    const favicon =
        document.getElementById(
            "favicon"
        );


    const appleTouchIcon =
        document.getElementById(
            "appleTouchIcon"
        );



    /* ==================================
       PROJEKTEK
    ================================== */

    let projektek = [];



    /* ==================================
       GITHUB MAPPA LISTA
    ================================== */

    async function projektekBetoltese() {

        try {

            const apiUrl =
                "https://api.github.com/repos/" +
                encodeURIComponent(
                    GITHUB_USER
                ) +
                "/" +
                encodeURIComponent(
                    GITHUB_REPO
                ) +
                "/contents/?ref=" +
                encodeURIComponent(
                    GITHUB_BRANCH
                );


            const response =
                await fetch(
                    apiUrl,
                    {

                        headers: {

                            "Accept":
                                "application/vnd.github+json"

                        },

                        cache:
                            "no-store"

                    }
                );


            if (
                !response.ok
            ) {

                throw new Error(
                    "GitHub API hiba: " +
                    response.status
                );

            }


            const tartalom =
                await response.json();


            projektek =
                tartalom
                    .filter(

                        elem =>
                            elem.type ===
                            "dir"

                    )
                    .filter(

                        elem =>
                            !KIZART_MAPPAK.includes(
                                elem.name
                            )

                    )
                    .filter(

                        elem =>
                            !elem.name.startsWith(
                                "."
                            )

                    );


            projektek.sort(

                (
                    a,
                    b
                ) =>

                    a.name.localeCompare(
                        b.name,
                        "hu",
                        {
                            sensitivity:
                                "base"
                        }
                    )

            );


            projektekKirajzolasa();


            aktualisRouteBetoltese();

        }

        catch (
            error
        ) {

            console.error(
                error
            );


            appsGrid.innerHTML =
                "";


            uzenet(
                "A projektek nem tölthetők be."
            );

        }

    }



    /* ==================================
       KÁRTYÁK
    ================================== */

    function projektekKirajzolasa() {

        appsGrid.innerHTML =
            "";


        if (
            projektek.length === 0
        ) {

            uzenet(
                "Nincs megjeleníthető projekt."
            );

            return;

        }


        projektek.forEach(
            projekt => {

                projektKartya(
                    projekt.name
                );

            }
        );

    }



    /* ==================================
       PROJEKT KÁRTYA
    ================================== */

    function projektKartya(
        mappaNev
    ) {

        const link =
            document.createElement(
                "a"
            );


        link.className =
            "app-card";


        link.href =
            "#" +
            slugKeszites(
                mappaNev
            );


        link.addEventListener(
            "click",
            event => {

                event.preventDefault();


                projektMegnyitasa(
                    mappaNev,
                    true
                );

            }
        );


        /* IKON DOBOZ */

        const iconBox =
            document.createElement(
                "div"
            );


        iconBox.className =
            "icon-box";


        /* IKON */

        const icon =
            document.createElement(
                "img"
            );


        icon.src =
            ikonUrl(
                mappaNev
            );


        icon.alt =
            mappaNev;


        icon.draggable =
            false;


        icon.loading =
            "lazy";


        icon.onerror =
            function() {

                icon.remove();


                const fallback =
                    document.createElement(
                        "div"
                    );


                fallback.className =
                    "fallback-icon";


                fallback.textContent =
                    elsoBetu(
                        mappaNev
                    );


                iconBox.appendChild(
                    fallback
                );

            };


        /* NÉV */

        const nev =
            document.createElement(
                "div"
            );


        nev.className =
            "app-name";


        nev.textContent =
            mappaNev;


        iconBox.appendChild(
            icon
        );


        link.appendChild(
            iconBox
        );


        link.appendChild(
            nev
        );


        appsGrid.appendChild(
            link
        );

    }



    /* ==================================
       PROJEKT MEGNYITÁSA
    ================================== */

    function projektMegnyitasa(
        mappaNev,
        historyHozzaadas
    ) {

        const src =
            projektUrl(
                mappaNev
            );


        projectTitle.textContent =
            mappaNev;


        projectMiniIcon.src =
            ikonUrl(
                mappaNev
            );


        projectMiniIcon.onerror =
            function() {

                this.style.visibility =
                    "hidden";

            };


        projectMiniIcon.onload =
            function() {

                this.style.visibility =
                    "visible";

            };


        projectFrame.src =
            src;


        launcher.hidden =
            true;


        projectView.hidden =
            false;


        document.title =
            mappaNev +
            " – Kis Ticián";


        projektFavicon(
            mappaNev
        );


        if (
            historyHozzaadas
        ) {

            history.pushState(
                {
                    projekt:
                        mappaNev
                },
                "",
                "#" +
                slugKeszites(
                    mappaNev
                )
            );

        }

    }



    /* ==================================
       PROJEKT BEZÁRÁSA
    ================================== */

    function projektBezarasa(
        historyHozzaadas
    ) {

        projectFrame.src =
            "about:blank";


        projectView.hidden =
            true;


        launcher.hidden =
            false;


        document.title =
            "Kis Ticián";


        launcherFavicon();


        if (
            historyHozzaadas
        ) {

            history.pushState(
                {},
                "",
                window.location.pathname
            );

        }

    }



    /* ==================================
       VISSZA
    ================================== */

    backButton.addEventListener(
        "click",
        () => {

            if (
                window.location.hash
            ) {

                history.back();

            }

            else {

                projektBezarasa(
                    false
                );

            }

        }
    );



    /* ==================================
       BÖNGÉSZŐ VISSZA / ELŐRE
    ================================== */

    window.addEventListener(
        "popstate",
        () => {

            aktualisRouteBetoltese();

        }
    );



    /* ==================================
       HASH ALAPJÁN PROJEKT
    ================================== */

    function aktualisRouteBetoltese() {

        const hash =
            window.location.hash
                .replace(
                    "#",
                    ""
                )
                .trim();


        if (
            !hash
        ) {

            projektBezarasa(
                false
            );

            return;

        }


        const projekt =
            projektek.find(

                elem =>
                    slugKeszites(
                        elem.name
                    ) ===
                    hash

            );


        if (
            projekt
        ) {

            projektMegnyitasa(
                projekt.name,
                false
            );

        }

        else {

            projektBezarasa(
                false
            );

        }

    }



    /* ==================================
       PROJEKT URL
    ================================== */

    function projektUrl(
        mappaNev
    ) {

        return (
            "./" +
            encodeURIComponent(
                mappaNev
            ) +
            "/index.html"
        );

    }



    /* ==================================
       IKON URL
    ================================== */

    function ikonUrl(
        mappaNev
    ) {

        return (
            "./ikonok/" +
            encodeURIComponent(
                mappaNev
            ) +
            ".png"
        );

    }



    /* ==================================
       PROJEKT FAVICON
    ================================== */

    function projektFavicon(
        mappaNev
    ) {

        const url =
            ikonUrl(
                mappaNev
            );


        const teszt =
            new Image();


        teszt.onload =
            function() {

                favicon.href =
                    url;


                appleTouchIcon.href =
                    url;

            };


        teszt.onerror =
            function() {

                launcherFavicon();

            };


        teszt.src =
            url;

    }



    /* ==================================
       LAUNCHER FAVICON
    ================================== */

    function launcherFavicon() {

        favicon.href =
            "./favicon.png";


        appleTouchIcon.href =
            "./favicon.png";

    }



    /* ==================================
       SZÉP URL HASH
    ================================== */

    function slugKeszites(
        szoveg
    ) {

        return szoveg

            .normalize(
                "NFD"
            )

            .replace(
                /[\u0300-\u036f]/g,
                ""
            )

            .toLowerCase()

            .replace(
                /[^a-z0-9]+/g,
                "-"
            )

            .replace(
                /^-+|-+$/g,
                ""
            );

    }



    /* ==================================
       ELSŐ BETŰ
    ================================== */

    function elsoBetu(
        szoveg
    ) {

        const tisztitott =
            szoveg.trim();


        if (
            !tisztitott
        ) {

            return "?";

        }


        return tisztitott
            .charAt(0)
            .toUpperCase();

    }



    /* ==================================
       ÜZENET
    ================================== */

    function uzenet(
        szoveg
    ) {

        const message =
            document.createElement(
                "div"
            );


        message.className =
            "message";


        message.textContent =
            szoveg;


        appsGrid.appendChild(
            message
        );

    }



    /* ==================================
       INDÍTÁS
    ================================== */

    projektekBetoltese();

</script>

</body>
</html>
