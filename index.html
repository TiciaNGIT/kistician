<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <meta name="theme-color" content="#24272b">

    <title>KisTician</title>

    <style>
        :root {
            --bg: #24272b;
            --panel: #2e3237;
            --panel-hover: #373c42;

            --border: #444a50;

            --text: #ffffff;
            --muted: #aeb4ba;

            --green: #8bb52a;
            --green-dark: #6f941e;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            min-height: 100%;

            background: var(--bg);

            color: var(--text);

            font-family:
                Bahnschrift,
                "Segoe UI",
                Arial,
                sans-serif;
        }

        body {
            min-height: 100vh;
        }

        .app {
            width: 100%;
            max-width: 720px;

            margin: 0 auto;

            padding:
                20px
                15px
                calc(35px + env(safe-area-inset-bottom));
        }

        .header {
            text-align: center;

            padding:
                22px
                5px
                30px;
        }

        .header h1 {
            margin: 0;

            font-size: 30px;
            font-weight: 700;

            color: #ffffff;
        }

        .header p {
            margin:
                8px
                0
                0;

            color: var(--muted);

            font-size: 13px;
        }

        .apps-grid {
            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 14px;
        }

        .app-card {
            min-width: 0;

            display: flex;
            flex-direction: column;

            align-items: center;

            gap: 11px;

            padding:
                14px
                7px
                13px;

            border:
                1px
                solid
                var(--border);

            border-radius: 18px;

            background: var(--panel);

            color: var(--text);

            text-decoration: none;

            cursor: pointer;

            box-shadow:
                0
                8px
                22px
                rgba(0, 0, 0, .16);

            transition:
                transform .15s ease,
                background .15s ease,
                border-color .15s ease;
        }

        .app-card:active {
            transform: scale(.95);

            background: var(--panel-hover);

            border-color: var(--green);
        }

        .icon {
            width: 72px;
            height: 72px;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            border-radius: 18px;

            background: #ffffff;

            box-shadow:
                0
                5px
                16px
                rgba(0, 0, 0, .22);
        }

        .icon img {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .fallback-icon {
            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    var(--green-dark),
                    var(--green)
                );

            color: #ffffff;

            font-size: 28px;
            font-weight: 700;
        }

        .app-name {
            width: 100%;

            min-height: 34px;

            display: flex;
            align-items: flex-start;
            justify-content: center;

            text-align: center;

            font-size: 12px;
            line-height: 1.3;
            font-weight: 600;

            overflow-wrap: anywhere;
        }

        .loading,
        .message {
            grid-column: 1 / -1;

            padding: 50px 20px;

            text-align: center;

            color: var(--muted);

            font-size: 14px;
        }

        .spinner {
            width: 30px;
            height: 30px;

            margin:
                0
                auto
                15px;

            border:
                3px
                solid
                #444a50;

            border-top-color:
                var(--green);

            border-radius: 50%;

            animation:
                spin .8s
                linear
                infinite;
        }

        @keyframes spin {
            to {
                transform:
                    rotate(360deg);
            }
        }

        @media (min-width: 500px) {

            .apps-grid {
                grid-template-columns:
                    repeat(4, minmax(0, 1fr));
            }

            .icon {
                width: 80px;
                height: 80px;
            }

            .app-name {
                font-size: 13px;
            }

        }

        @media (max-width: 350px) {

            .apps-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

        }
    </style>
</head>


<body>

<div class="app">

    <header class="header">

        <h1>
            KisTician
        </h1>

        <p>
            Alkalmazások
        </p>

    </header>


    <main
        class="apps-grid"
        id="appsGrid"
    >

        <div class="loading">

            <div class="spinner"></div>

            Alkalmazások betöltése...

        </div>

    </main>

</div>


<script>

    const GITHUB_USER =
        "TicianGIT";

    const GITHUB_REPO =
        "kistician";


    const KIZART_MAPPAK = [

        "ikonok",
        ".github",
        ".git"

    ];


    const appsGrid =
        document.getElementById(
            "appsGrid"
        );


    async function alkalmazasokBetoltese() {

        try {

            const apiUrl =
                "https://api.github.com/repos/" +
                encodeURIComponent(GITHUB_USER) +
                "/" +
                encodeURIComponent(GITHUB_REPO) +
                "/contents/";


            const response =
                await fetch(
                    apiUrl,
                    {
                        headers: {
                            "Accept":
                                "application/vnd.github+json"
                        },

                        cache:
                            "no-store"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "GitHub API hiba: " +
                    response.status
                );

            }


            const tartalom =
                await response.json();


            const mappak =
                tartalom
                    .filter(
                        elem =>
                            elem.type === "dir"
                    )
                    .filter(
                        elem =>
                            !KIZART_MAPPAK.includes(
                                elem.name
                            )
                    )
                    .filter(
                        elem =>
                            !elem.name.startsWith(".")
                    );


            appsGrid.innerHTML =
                "";


            if (
                mappak.length === 0
            ) {

                uzenetMegjelenitese(
                    "Nincs megjeleníthető alkalmazás."
                );

                return;

            }


            mappak.sort(
                (a, b) =>
                    a.name.localeCompare(
                        b.name,
                        "hu",
                        {
                            sensitivity:
                                "base"
                        }
                    )
            );


            for (
                const mappa
                of mappak
            ) {

                const vanIndex =
                    await indexLetezik(
                        mappa.name
                    );


                if (!vanIndex) {

                    continue;

                }


                alkalmazasLetrehozasa(
                    mappa.name
                );

            }


            if (
                appsGrid.children.length === 0
            ) {

                uzenetMegjelenitese(
                    "Nem található index.html fájlt tartalmazó projektmappa."
                );

            }

        }

        catch (error) {

            console.error(
                error
            );


            appsGrid.innerHTML =
                "";


            uzenetMegjelenitese(
                "Az alkalmazások listája nem tölthető be."
            );

        }

    }



    async function indexLetezik(
        mappaNev
    ) {

        try {

            const url =
                "./" +
                encodeURIComponent(
                    mappaNev
                ) +
                "/index.html";


            const response =
                await fetch(
                    url,
                    {
                        method:
                            "GET",

                        cache:
                            "no-store"
                    }
                );


            return response.ok;

        }

        catch {

            return false;

        }

    }



    function alkalmazasLetrehozasa(
        mappaNev
    ) {

        const mappaUrl =
            "./" +
            encodeURIComponent(
                mappaNev
            ) +
            "/index.html";


        const ikonUrl =
            "./ikonok/" +
            encodeURIComponent(
                mappaNev
            ) +
            ".png";


        const link =
            document.createElement(
                "a"
            );


        link.className =
            "app-card";


        link.href =
            mappaUrl;


        const iconBox =
            document.createElement(
                "div"
            );


        iconBox.className =
            "icon";


        const icon =
            document.createElement(
                "img"
            );


        icon.src =
            ikonUrl;


        icon.alt =
            mappaNev;


        icon.draggable =
            false;


        icon.onerror =
            function () {

                icon.remove();


                const fallback =
                    document.createElement(
                        "div"
                    );


                fallback.className =
                    "fallback-icon";


                fallback.textContent =
                    elsoBetu(
                        mappaNev
                    );


                iconBox.appendChild(
                    fallback
                );

            };


        const name =
            document.createElement(
                "div"
            );


        name.className =
            "app-name";


        name.textContent =
            mappaNev;


        iconBox.appendChild(
            icon
        );


        link.appendChild(
            iconBox
        );


        link.appendChild(
            name
        );


        appsGrid.appendChild(
            link
        );

    }



    function elsoBetu(
        szoveg
    ) {

        const tisztitott =
            szoveg.trim();


        if (!tisztitott) {

            return "?";

        }


        return tisztitott
            .charAt(0)
            .toUpperCase();

    }



    function uzenetMegjelenitese(
        szoveg
    ) {

        const message =
            document.createElement(
                "div"
            );


        message.className =
            "message";


        message.textContent =
            szoveg;


        appsGrid.appendChild(
            message
        );

    }



    alkalmazasokBetoltese();

</script>

</body>
</html>
